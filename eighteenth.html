<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>18th Selection</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(to right, #6676e7, #7d52b5);
      font-family: 'Poppins', sans-serif;
      padding:20px;
    }

    .container{
      width:600px;
      max-width:100%;
      min-height:600px;
      background:#efe9d9;
      border-radius:22px;
      padding:24px 44px 40px;
      position:relative;
      box-shadow:0 15px 40px rgba(0,0,0,0.18);
    }

    /* Top Buttons */
    .top-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .back-btn{
      border:3px solid #7d52b5;
      background:transparent;
      color:#7d52b5;
      font-size:18px;
      font-weight:600;
      padding:12px 24px;
      border-radius:16px;
      cursor:pointer;
      transition:0.3s;
    }

    .back-btn:hover{
      background:#7d52b5;
      color:white;
    }

    .close-btn{
  width:62px;
  height:62px;
  border-radius:50%;
  border:3px solid #7d52b5;
  background:transparent;
  color:#7d52b5;

  /* Smaller X */
  font-size:24px;
  font-weight:700;

  /* Perfect centering */
  display:flex;
  justify-content:center;
  align-items:center;

  cursor:pointer;
  transition:0.3s;
  text-decoration:none;
}

.close-btn:hover{
  background:#7d52b5;
  color:white;
  transform: rotate(90deg);
}

    /* Title */
    h1{
      text-align:center;
      margin-top:-5px;
      font-size:30px;
      color:#7d52b5;
      font-family:'Playfair Display', serif;
      text-shadow:0 3px 4px rgba(0,0,0,0.15);
    }

    /* Menu */
    .menu{
      margin-top:70px;
      display:flex;
      flex-direction:column;
      gap:22px;
    }

    .menu-btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:16px;
      font-size:18px;
      font-weight:600;
      color:white;
      cursor:pointer;
      background:linear-gradient(to right, #6676e7, #7d52b5);
      box-shadow:0 10px 20px rgba(0,0,0,0.15);
      transition:0.3s;

      display:flex;
    justify-content:center;
    align-items:center;

    text-decoration:none;
    }

    .menu-btn:hover{
      transform:translateY(-3px) scale(1.01);
      box-shadow:0 14px 28px rgba(0,0,0,0.22);
    }

    .menu-btn:active{
      transform:scale(0.98);
    }

    @media (max-width:768px){

      .container{
        padding:20px;
      }

      h1{
        font-size:42px;
        margin-top:15px;
      }

      .menu{
        margin-top:70px;
      }

      .menu-btn{
        font-size:18px;
        padding:18px;
      }

      .close-btn{
        width:52px;
        height:52px;
        font-size:34px;
      }

      .back-btn{
        font-size:15px;
        padding:10px 18px;
      }
    }

    /* PAGE ENTER ANIMATION */
.container{
  animation: pageEnter 0.5s ease;
}

/* Page entering */
@keyframes pageEnter{
  from{
    opacity:0;
    transform:translateX(80px);
  }

  to{
    opacity:1;
    transform:translateX(0);
  }
}

/* Page exiting */
.page-exit{
  animation: pageExit 0.5s ease forwards;
}

@keyframes pageExit{
  from{
    opacity:1;
    transform:translateX(0);
  }

  to{
    opacity:0;
    transform:translateX(-80px);
  }
}
  </style>
</head>

<body>

  <div class="container">

    <div class="top-bar">
    <a href="index.html" class="close-btn">✕</a>
      
    </div>

    <h1>What 18th are you?</h1>

    <div class="menu">

      <a href="yarns.html" class="menu-btn page-link">🧶 18 Yarns</a>

      <a href="candles.html" class="menu-btn page-link">🕯️ 18 Candles</a>

      <a href="bills.html" class="menu-btn page-link">💰 18 Bills</a>

      <a href="gifts.html" class="menu-btn page-link">🎁 18 Gifts</a>

      <a href="wines.html" class="menu-btn page-link">🍷 18 Wines</a>

      <a href="dances.html" class="menu-btn page-link">💃 18 Dances</a>

    </div>

  </div>

  <script>
  // Select all page links
  const pageLinks = document.querySelectorAll(".page-link");

  // Add click animation before changing page
  pageLinks.forEach(link => {
    link.addEventListener("click", function(e) {
      e.preventDefault();

      const target = this.getAttribute("href");
      const container = document.querySelector(".container");

      // Animate current card out
      container.classList.add("page-exit");

      // Open next page after animation
      setTimeout(() => {
        window.location.href = target;
      }, 500);
    });
  });

  // Optional close button animation
  document.querySelector(".close-btn")
    .addEventListener("click", function(e) {
      e.preventDefault();

      const target = this.getAttribute("href");
      const container = document.querySelector(".container");

      container.classList.add("page-exit");

      setTimeout(() => {
        window.location.href = target;
      }, 500);
    });
</script>

</body>
</html>
